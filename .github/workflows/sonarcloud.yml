name: SonarQube Cloud Analysis

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: Build + SonarQube Cloud scan
    runs-on: windows-2022
    env:
      BUILD_WRAPPER_OUT_DIR: build_wrapper_output_directory

    steps:
      - name: Checkout Fort Firewall
        uses: actions/checkout@v4
        with:
          # Disabling shallow clones improves the relevancy of SonarQube reporting.
          fetch-depth: 0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          arch: "win64_msvc2019_64"
          cache: true

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Build Wrapper
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@v6

      - name: Create build directory
        run: mkdir build

      - name: qmake
        working-directory: build
        shell: cmd
        run: qmake "%GITHUB_WORKSPACE%\src\FortFirewall.pro"

      - name: Build with Build Wrapper
        working-directory: build
        shell: cmd
        run: build-wrapper-win-x86-64 --out-dir "%GITHUB_WORKSPACE%\%BUILD_WRAPPER_OUT_DIR%" nmake

      - name: Check SONAR_TOKEN
        id: check_sonar_token
        shell: bash
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "::warning::SONAR_TOKEN secret is not configured; skipping SonarQube Cloud scan."
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: SonarQube Cloud Scan
        if: steps.check_sonar_token.outputs.has_token == 'true'
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            --define sonar.cfamily.compile-commands="${{ env.BUILD_WRAPPER_OUT_DIR }}/compile_commands.json"
