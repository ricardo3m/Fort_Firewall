name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds the Qt UI (the real FortFirewall.exe) plus the driver's common/
  # sources and the new redirect callouts in USER MODE, using the project's
  # own WDK-mock headers (src/driver/wdm/um_*.h). This does not need a real
  # WDK install and also runs the GoogleTest unit tests (UtilTest, etc.).
  build-and-test:
    name: Build UI + run unit tests
    runs-on: windows-2022

    steps:
      - name: Checkout Fort Firewall
        uses: actions/checkout@v4

      - name: Checkout GoogleTest
        uses: actions/checkout@v4
        with:
          repository: google/googletest
          ref: v1.15.2
          path: googletest-src

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          arch: "win64_msvc2019_64"
          cache: true

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Create build directory
        run: mkdir build

      - name: qmake
        working-directory: build
        shell: cmd
        env:
          GOOGLETEST_DIR: ${{ github.workspace }}\googletest-src
        run: qmake CONFIG+=tests "%GITHUB_WORKSPACE%\src\FortFirewall.pro"

      - name: nmake
        working-directory: build
        shell: cmd
        env:
          GOOGLETEST_DIR: ${{ github.workspace }}\googletest-src
        run: nmake

      - name: Run unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exes = Get-ChildItem -Path build -Recurse -Include LogBufferTest.exe,LogReaderTest.exe,StatTest.exe,UtilTest.exe -ErrorAction SilentlyContinue
          if (-not $exes) {
            Write-Host "::error::No test executables were found under build/"
            exit 1
          }
          $failed = $false
          foreach ($exe in $exes) {
            Write-Host "==> Running $($exe.FullName)"
            & $exe.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::$($exe.Name) failed with exit code $LASTEXITCODE"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Upload UI build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fort-firewall-ui
          path: build/ui_bin/**/*.exe
          if-no-files-found: ignore

  # Best-effort build of the real kernel driver (fortdrv.vcxproj) against the
  # WDK that is preinstalled on the windows-2022 GitHub runner image. This is
  # the authoritative validation against real WFP/WDK headers (as opposed to
  # the user-mode mocks used above). DDK_LIB_PATH/SDK_LIB_PATH are computed
  # from the installed Windows Kits layout; adjust if the runner image changes.
  build-driver-kernel:
    name: Build kernel driver (WDK, x64/Win10)
    runs-on: windows-2022

    steps:
      - name: Checkout Fort Firewall
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Resolve WDK/SDK lib paths
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $libRoot = "C:\Program Files (x86)\Windows Kits\10\Lib"
          $version = Get-ChildItem $libRoot -Directory |
              Where-Object { $_.Name -match '^10\.0\.\d+\.0$' } |
              Sort-Object Name -Descending |
              Select-Object -First 1
          if (-not $version) { throw "No installed Windows Kits 10 Lib version found under $libRoot" }
          Write-Host "Using Windows Kit version: $($version.Name)"
          "DDK_LIB_PATH=$($version.FullName)\km\x64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SDK_LIB_PATH=$($version.FullName)\um\x64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build fortdrv.vcxproj (x64, Windows 10)
        shell: cmd
        working-directory: src/driver
        run: msvcbuild-win10-64.bat

      - name: Upload driver build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fortfw-driver-x64-win10
          path: build-driver-win10/x64/**
          if-no-files-found: ignore
